name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag to publish, for example v0.5.1
        required: true
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release-identity.outputs.release_commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - name: Verify release tag and package version
        id: release-identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.5.1" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: uv sync --group dev
      - name: Run full suite with release coverage
        run: >-
          uv run pytest
          --junitxml=release-test-report.xml
          --cov=src/synthpopcan
          --cov-branch
          --cov-report=xml:release-coverage.xml
          --cov-fail-under=95
      - name: Run extended correctness suite
        run: >-
          sh scripts/check-correctness.sh
          --junitxml=release-correctness-report.xml
      - run: uv build
      - name: Smoke-test installed wheel
        run: sh scripts/check-wheel.sh | tee release-wheel-smoke.log
      - name: Assemble release evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p release-evidence
          cp dist/* release-test-report.xml release-coverage.xml release-correctness-report.xml release-wheel-smoke.log pyproject.toml uv.lock release-evidence/
          python scripts/build_release_evidence.py \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --version "$PACKAGE_VERSION" \
            --output release-evidence/manifest.json \
            release-evidence/synthpopcan-* \
            release-evidence/release-test-report.xml \
            release-evidence/release-coverage.xml \
            release-evidence/release-correctness-report.xml \
            release-evidence/release-wheel-smoke.log \
            release-evidence/pyproject.toml release-evidence/uv.lock
          cd release-evidence
          sha256sum * > SHA256SUMS
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/*
      - name: Retain complete release evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ inputs.tag }}
          path: release-evidence/*

  attach-to-github-release:
    name: Attach permanent evidence to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-evidence-${{ inputs.tag }}
          path: release-evidence/
      - name: Upload distributions and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          test "$(jq -r .release.commit release-evidence/manifest.json)" = "$RELEASE_COMMIT"
          test "$(jq -r .release.tag release-evidence/manifest.json)" = "$RELEASE_TAG"
          cd release-evidence
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" * --clobber --repo "$GITHUB_REPOSITORY"

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, attach-to-github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synthpopcan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
