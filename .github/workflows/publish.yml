name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag to publish, for example v0.5.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.5.1" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: uv sync --group dev
      - name: Run extended correctness suite
        run: >-
          sh scripts/check-correctness.sh
          --junitxml=release-correctness-report.xml
      - name: Retain release correctness report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-correctness-report-${{ github.sha }}
          path: release-correctness-report.xml
      - run: uv build
      - name: Smoke-test installed wheel
        run: sh scripts/check-wheel.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synthpopcan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
