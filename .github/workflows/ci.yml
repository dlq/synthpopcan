name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --group docs

      - name: Verify release-facing source versions agree
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release_evidence.py \
            --check-source-version \
            --version "$PACKAGE_VERSION"

      - name: Lint Python
        run: uv run --locked ruff check src tests scripts

      - name: Check Python formatting
        run: uv run --locked ruff format --check src tests scripts

      - name: Check Python types
        run: uv run --locked pyright src

      - name: Validate citation metadata against the CFF schema
        run: uv run --locked cffconvert --validate

      - name: Run tests with enforced coverage
        run: >-
          uv run --locked pytest
          --junitxml=correctness-report.xml
          --cov=src/synthpopcan
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=95

      - name: Retain machine-readable correctness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: correctness-report-python-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            correctness-report.xml
            coverage.xml

      - name: Check Markdown formatting
        run: uv run --locked --group docs mdformat --check docs README.md

      - name: Build documentation
        run: uv run --locked sphinx-build -W -b html docs docs/_build/html

  python-summary:
    name: Python
    if: ${{ always() }}
    needs: python
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete Python matrix
        env:
          PYTHON_MATRIX_RESULT: ${{ needs.python.result }}
        run: test "$PYTHON_MATRIX_RESULT" = "success"

  smoke:
    name: Smoke test (clean install)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          uv lock --check
          uv build --wheel

      - name: Install wheel in isolated environment
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install dist/*.whl

      - name: Verify CART training dependency is not installed at runtime
        run: >-
          .smoke-venv/bin/python -c
          "import importlib.util; assert importlib.util.find_spec('sklearn') is None"

      - name: Verify CFF validation remains a development-only dependency
        run: >-
          .smoke-venv/bin/python -c
          "import importlib.util; assert importlib.util.find_spec('cffconvert') is None"

      - name: Verify installed distribution and runtime versions agree
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          .smoke-venv/bin/python -c \
            "import importlib.metadata, synthpopcan, sys; expected=sys.argv[1]; assert importlib.metadata.version('synthpopcan') == expected; assert synthpopcan.__version__ == expected" \
            "$PACKAGE_VERSION"

      - name: Verify CLI entry point
        run: .smoke-venv/bin/synthpopcan --help

      - name: Verify guide commands
        run: |
          .smoke-venv/bin/synthpopcan guide ipf
          .smoke-venv/bin/synthpopcan guide model

      - name: Verify model catalogue
        run: |
          .smoke-venv/bin/synthpopcan models list
          .smoke-venv/bin/synthpopcan models show demo-linked-household-person

      - name: Verify bundled demo generation without CART dependency
        run: |
          .smoke-venv/bin/synthpopcan models generate \
            demo-linked-household-person \
            --households 10 \
            --out /tmp/smoke-population
          .smoke-venv/bin/synthpopcan bundle create \
            /tmp/smoke-population \
            --out /tmp/smoke-exchange \
            --access public \
            --redistribution permitted
          .smoke-venv/bin/synthpopcan bundle validate /tmp/smoke-exchange

  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --group dev

      - name: Check web assets
        run: npm run check:web

      - name: Run web unit tests with coverage guardrails
        run: npm run test:web:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser scenarios
        run: npm run test:web:e2e
