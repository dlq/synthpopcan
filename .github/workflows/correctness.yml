name: Extended correctness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

jobs:
  correctness:
    name: Extended numerical and artifact oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Run extended correctness suite
        env:
          UV_LOCKED: "1"
        run: sh scripts/check-correctness.sh --junitxml=correctness-report.xml
      - name: Retain extended correctness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-correctness-report-${{ github.sha }}
          path: correctness-report.xml

  statcan-drift:
    name: Live Statistics Canada interface drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Check the live WDS interface
        env:
          SYNTHPOPCAN_LIVE_STATCAN: "1"
        run: >-
          uv run --locked pytest tests/test_statcan_live.py
          --junitxml=statcan-drift-report.xml
      - name: Retain StatCan drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statcan-drift-report-${{ github.sha }}
          path: statcan-drift-report.xml
