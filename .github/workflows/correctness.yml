name: Extended correctness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

jobs:
  correctness:
    name: Extended numerical and artifact oracles
    if: ${{ !startsWith(github.ref_name, 'ci/python315-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Run extended correctness suite
        env:
          UV_LOCKED: "1"
        run: sh scripts/check-correctness.sh --junitxml=correctness-report.xml
      - name: Retain extended correctness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-correctness-report-${{ github.sha }}
          path: correctness-report.xml

  statcan-drift:
    name: Live Statistics Canada interface drift
    if: ${{ !startsWith(github.ref_name, 'ci/python315-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Check the live WDS interface
        env:
          SYNTHPOPCAN_LIVE_STATCAN: "1"
        run: >-
          uv run --locked pytest tests/test_statcan_live.py
          --junitxml=statcan-drift-report.xml
      - name: Retain StatCan drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statcan-drift-report-${{ github.sha }}
          path: statcan-drift-report.xml

  python-315:
    name: Python 3.15 experimental acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'ci/python315-') }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.15"
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked development and optional dependencies
        run: uv sync --locked --group dev --group docs --extra performance --extra model-build
      - name: Record platform and installed versions
        run: |
          uname -a
          uv run python --version
          uv pip list
      - name: Full test suite with coverage
        run: >-
          uv run --locked --extra performance --extra model-build python scripts/test_runner.py full --
          --junitxml=python315-tests.xml --cov=src/synthpopcan --cov-branch
          --cov-report=xml:python315-coverage.xml --cov-fail-under=95
      - name: Extended correctness
        run: sh scripts/check-correctness.sh --junitxml=python315-correctness.xml
      - name: Build documentation
        run: uv run --locked --group docs sphinx-build -W -b html docs /tmp/synthpopcan-python315-docs
      - name: Web checks and browser scenarios
        run: |
          npm ci
          npm run check:web
          uv run python scripts/check_web_localization.py
          npm run test:web:coverage
          npx playwright install --with-deps chromium
          npm run test:web:e2e
      - name: Build and smoke test wheel and sdist with extras
        run: |
          rm -rf dist
          uv build --wheel --sdist
          sh scripts/check-wheel.sh
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python315-acceptance-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            python315-tests.xml
            python315-coverage.xml
            python315-correctness.xml
