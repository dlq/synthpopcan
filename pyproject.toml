[project]
name = "synthpopcan"
version = "1.0.0"
description = "Build, inspect, and validate modelled Canadian households and people for reproducible research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Darcy Quesnel", email = "darcy.quesnel@gmail.com" },
]
keywords = [
  "synthetic population",
  "census",
  "statistics canada",
  "ipf",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8.4.1",
    "fastapi>=0.141.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.12",
    "pyshp>=3.1.3",
    "rich>=15.0.0",
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
# CART training is an authoring workflow.  Reading its portable JSON output and
# generating populations do not require scikit-learn.
model-build = [
    "scikit-learn>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/dlq/synthpopcan"
Documentation = "https://synthpopcan.readthedocs.io/"
Source = "https://github.com/dlq/synthpopcan"
Issues = "https://github.com/dlq/synthpopcan/issues"

[project.scripts]
synthpopcan = "synthpopcan.cli:cli"

[dependency-groups]
dev = [
  "cffconvert>=2.0.0",
  # Keep the isolated build backend in the locked release environment too.
  "hatchling==1.32.0",
  "httpx>=0.28.1",
  "pre-commit>=4.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "scikit-learn>=1.9.0",
]
docs = [
    "doc8>=2.0.0",
    "furo>=2025.7.19",
    "mdformat>=1.0.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Local editor state is intentionally ignored by Git and must never be copied
# into a source distribution assembled from a developer checkout.
exclude = [
  "/.vscode/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_statcan: opt-in tests that call live Statistics Canada services",
  "performance: opt-in timing-sensitive tests for local performance checks",
  "scenario(id): stable acceptance-scenario ID documented in tests/SCENARIOS.md",
]

[tool.coverage.run]
branch = true
source = ["synthpopcan"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]

[tool.doc8]
ignore-path = ["docs/_build"]
max-line-length = 88

[tool.uv]
package = true
